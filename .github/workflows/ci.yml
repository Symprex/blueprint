name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    # windows-latest, not ubuntu-latest, and this is load-bearing rather than incidental. The
    # first CI run on Linux failed 68 tests: 67 Verify snapshot mismatches, because the committed
    # .verified.txt baselines carry CRLF and a BOM while the generator emits LF on Linux, and one
    # Blueprint.Codemod test that starts `powershell`, which does not exist there. This repository
    # is Windows-native throughout — .symprex/config.json, copilot-instructions.md and the Husky
    # hooks are all PowerShell — so CI matching the developer environment is the fix. Moving back
    # to ubuntu means making 67 baselines line-ending agnostic and the process invocation `pwsh`
    # first; it is not a one-line change.
    runs-on: windows-latest
    steps:
      # MinVer derives the package version from git tags and commit height, and the default
      # fetch-depth: 1 shallow clone gives it neither — without full history a local pack and a
      # CI pack would silently disagree. This is not just for the publish job: PR/branch builds
      # go through the same MinVer-versioned props, so they need the same history to compute a
      # sane (if unpublished) version.
      # Must precede checkout. Windows MAX_PATH is 260 characters and the Verify snapshot
      # baselines have long, descriptive filenames; under the runner workspace path the
      # checkout itself fails with "Filename too long" before a single step runs.
      - name: Enable git long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Blueprint.sln

      # Warnings are errors and StyleCop runs during build, so this step is the code-quality gate
      # as well as the build. There is no separate lint job because there is nothing left for one
      # to do. NuGetAudit stays enabled — a known vulnerability fails the build rather than being
      # silently tolerated.
      - name: Build
        run: dotnet build Blueprint.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test Blueprint.sln -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory ${{ runner.temp }}/test-results

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  # Deliberately separate from build-and-test and gated to tag pushes (plus a manual
  # workflow_dispatch escape hatch) — a release is a deliberate act, not something every merged
  # PR should trigger. The tag itself is the version: pushing v0.1.0 makes MinVer produce exactly
  # 0.1.0 here, with no separate "bump the version" step to forget.
  #
  # The two triggers version differently, deliberately: a tag push resolves to that tag's exact
  # version (v0.1.0 -> 0.1.0). A workflow_dispatch run has no tag to resolve, so MinVer falls back
  # to its untagged scheme (see src/Directory.Build.props): 0.1.0-alpha.0.<height>+<sha>. That is
  # the only way to exercise this job at all today — there are no tags in this repository yet —
  # and it cannot collide with a real release: MinVer only ever produces a plain "0.1.0" from an
  # actual "v0.1.0" tag, never from commit height, so the alpha build and the eventual tagged
  # release are always distinguishable. --skip-duplicate below means re-running dispatch against
  # the same commit is a harmless no-op rather than a push failure.
  publish:
    name: Pack and publish
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    # windows-latest, not ubuntu-latest, and this is load-bearing rather than incidental. The
    # first CI run on Linux failed 68 tests: 67 Verify snapshot mismatches, because the committed
    # .verified.txt baselines carry CRLF and a BOM while the generator emits LF on Linux, and one
    # Blueprint.Codemod test that starts `powershell`, which does not exist there. This repository
    # is Windows-native throughout — .symprex/config.json, copilot-instructions.md and the Husky
    # hooks are all PowerShell — so CI matching the developer environment is the fix. Moving back
    # to ubuntu means making 67 baselines line-ending agnostic and the process invocation `pwsh`
    # first; it is not a one-line change.
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Must precede checkout. Windows MAX_PATH is 260 characters and the Verify snapshot
      # baselines have long, descriptive filenames; under the runner workspace path the
      # checkout itself fails with "Filename too long" before a single step runs.
      - name: Enable git long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Blueprint.sln

      - name: Build
        run: dotnet build Blueprint.sln -c Release --no-restore

      # --no-build reuses the assemblies the Build step just produced. Packing a project fresh in
      # the same invocation is what let a Roslyn analyzer's `None Include="$(OutputPath)\*.dll"`
      # glob (Blueprint.SourceGenerator) evaluate against an empty output directory before Build
      # had populated it — a real, reproduced failure, not a hypothetical one.
      - name: Pack
        run: >
          dotnet pack Blueprint.sln -c Release --no-build
          -o ${{ runner.temp }}/packages

      # Explicit --source rather than anything added to NuGet.config: the repository's
      # NuGet.config lists only nuget.org, and three of these package IDs (Blueprint.Testing,
      # Blueprint.Http, Blueprint.Tasks.Hangfire) already exist there at 0.8.4 from the
      # barclayadam/blueprint upstream fork. An unqualified push could go to the wrong feed;
      # naming the GitHub Packages source here is what guarantees it doesn't.
      #
      # The glob is *.nupkg, not *.nupkg and *.snupkg — deliberately, not an oversight. GitHub
      # Packages' NuGet endpoint does not accept .snupkg symbol packages at all; including them
      # here would fail the push outright. The .snupkg files the Pack step produced alongside the
      # .nupkg ones are simply left unpublished.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "${{ runner.temp }}/packages/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
