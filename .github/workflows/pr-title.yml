name: PR title

# Fails a pull request whose title is not Conventional Commits, and labels it from the title's type
# so GitHub's generated release notes can group it (.github/release.yml). The rules live in
# .github/scripts/pr-title.mjs and are documented in docs/releasing.md.
#
# pull_request_target, not pull_request, so the token can label a PR from a fork. That is safe
# here only because the job checks out the base branch (the default for this event) and never
# runs code from the PR: the title is the only thing it reads.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

# One run per PR at a time, and never cancelled part-way through relabelling. A queued run still
# starts from a stale event, so the script reads the PR's current title and labels rather than the
# event's: otherwise an open and a quick retitle could each add their own label and leave both.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Check the title and apply labels
        uses: actions/github-script@v7
        with:
          script: |
            const { parsePrTitle, MANAGED_LABELS } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-title.mjs`);
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });

            // Bot PRs (the skills sync, for one) have titles we do not control; they are maintenance.
            const result = pr.user.type === 'Bot' ? { valid: true, labels: ['maintenance'] } : parsePrTitle(pr.title);

            if (!result.valid) {
              core.setFailed(result.error);
              return;
            }

            const current = pr.labels.map((label) => label.name);
            const stale = current.filter((name) => MANAGED_LABELS.includes(name) && !result.labels.includes(name));
            const missing = result.labels.filter((name) => !current.includes(name));

            for (const name of stale) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name });
            }

            // addLabels creates a label that does not exist yet, so no label set-up is needed.
            if (missing.length > 0) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: missing });
            }
